# Publica en GitHub Pages SOLO el contenido de dist/ (ver scripts/build.sh).
# Requiere: Settings > Pages > Build and deployment > Source = "GitHub Actions".
#
#  - pull_request: build + tests, sin publicar.
#  - push a main / ejecución manual sobre main: build + tests y, si pasan, publica.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Playwright y Chromium
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet playwright==1.56.0
          .venv/bin/playwright install --with-deps chromium
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          # Chromium de Playwright, fijo: evita depender de un /usr/bin/chromium del runner.
          echo "CHROMIUM_PATH=$(.venv/bin/python -c 'from playwright.sync_api import sync_playwright as s
          with s() as p: print(p.chromium.executable_path)')" >> "$GITHUB_ENV"

      - name: Generar dist/ y reporte de assets
        run: bash scripts/build.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # El validador Nu (vnu.jar) necesita Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias de tests
        run: |
          npm ci
          # Mismo Chromium que ya instaló el paso de Python (Playwright 1.56.0): es un no-op si está en caché.
          npx playwright install chromium

      # Bloquea el deploy: clic en los 12/19 links, deep links, hero quieto, horarios (page.clock),
      # formularios, comparador, 0 console.error/warning, 0 requests externos o 4xx/5xx,
      # axe A/AA = 0 y validador HTML = 0 errores. Todo sobre dist/, lo mismo que se publica.
      - name: Tests (e2e + axe + validador HTML) sobre dist/
        env:
          SKIP_BUILD: "1"
        run: node tests/support/run-all.mjs --skip-lighthouse

      # Presupuestos de tests/lighthouse/budgets.json (mediana de 3 corridas).
      # continue-on-error: el resultado queda visible (paso en rojo + reporte en build-report/lighthouse/)
      # pero NO bloquea el deploy, porque el rendimiento móvil hoy no cumple el presupuesto.
      # Para hacerlo bloqueante, borrá la línea `continue-on-error`.
      - name: Presupuestos de Lighthouse
        continue-on-error: true
        env:
          SKIP_BUILD: "1"
        run: node tests/support/run-all.mjs --only-lighthouse

      - name: Subir reporte (assets sin referencia y resultado de tests)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: build-report/
          if-no-files-found: ignore

      - name: Empaquetar dist/ para Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
